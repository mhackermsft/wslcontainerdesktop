# Merged into the project via `include:` in docker-compose.yml, which adds the "logs"
# service to the project.
#
# The `extends:` base used by the web service lives in web-base.yml instead, because an
# included file becomes part of the project and every project service must have an image
# or a build section.

services:
  logs:
    image: busybox:1.36
    command: ["sh", "-c", "while true; do echo 'tailing logs...'; sleep 60; done"]
